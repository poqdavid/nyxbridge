version: 2

# Weekly; minor and patch updates arrive grouped, majors one pull request each.
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-minor:
              update-types: [minor, patch]

    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
