name: Build

# Builds the flashable module zip from module/ on every push and PR.
#   - A manual run (Actions -> Build -> Run workflow) sends the zip to
#     Telegram as a CI build.
#   - A v* tag additionally publishes a GitHub Release, sends the zip to
#     Telegram as a Release build, and refreshes update.json.
#
#   module/                 <- all flashable files (module.prop + verify.sh at its root)
#   scripts/gen-hashes.sh   <- writes per-file .sha256 sidecars at build time
#   LICENSE, NOTICE.md      <- copied into the zip at build time
#   update.json             <- refreshed automatically on tagged releases
#   .github/workflows/build.yml
#   .github/scripts/telegram.py  <- posts the zip with its caption (tests next to it)
#
# Secrets used by the Telegram steps (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN   bot token from @BotFather
#   TELEGRAM_CHAT_ID     target channel/chat id (e.g. @yourchannel or -100...)

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write # needed to create releases and commit update.json

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history + tags, needed for the Telegram changelog

            - name: Read module version
              id: mod
              run: |
                  PROP=module/module.prop
                  if [ ! -f "$PROP" ]; then
                    echo "::error::$PROP not found — the flashable files must live in module/"
                    exit 1
                  fi
                  VERSION=$(sed -n 's/^version=//p'      "$PROP" | head -n1)
                  VERSION_CODE=$(sed -n 's/^versionCode=//p' "$PROP" | head -n1)
                  DESCRIPTION=$(sed -n 's/^description=//p' "$PROP" | head -n1)
                  if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
                    echo "::error::version / versionCode missing in module.prop"
                    exit 1
                  fi
                  ZIP="${{ github.event.repository.name }}-${VERSION}.zip"
                  {
                    echo "version=$VERSION"
                    echo "version_code=$VERSION_CODE"
                    echo "zip=$ZIP"
                    echo "description=$DESCRIPTION"
                  } >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION (code $VERSION_CODE) -> $ZIP"

            - name: Verify tag matches module.prop (tag builds only)
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  if [ "${{ github.ref_name }}" != "${{ steps.mod.outputs.version }}" ]; then
                    echo "::error::tag '${{ github.ref_name }}' != module.prop version '${{ steps.mod.outputs.version }}'"
                    exit 1
                  fi

            - name: Telegram caption tests
              run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Check and test the bridge program
              # The bridge logic is Rust (src/); these gates run on the host.
              run: |
                  cargo fmt --check
                  cargo clippy --release -- -D warnings
                  cargo test --release

            - name: Build the arm64 bridge program
              # cross builds a fully static aarch64 binary in a container, so
              # it needs no NDK here and runs on any arm64 Android device.
              # Placed at module/bin/nyxbridge, where the stage scripts, ctl.sh
              # and the WebUI run it and gen-hashes.sh then fingerprints it for
              # the install-time check. NYX_MODULE_VERSION is forwarded into
              # the container by Cross.toml and read by `nyxbridge --version`
              # (no build.rs).
              env:
                  NYX_MODULE_VERSION: ${{ steps.mod.outputs.version }}
              run: |
                  cargo install cross --locked
                  cross build --release --target aarch64-unknown-linux-musl
                  mkdir -p module/bin
                  cp target/aarch64-unknown-linux-musl/release/nyxbridge module/bin/nyxbridge
                  chmod 0755 module/bin/nyxbridge
                  file module/bin/nyxbridge

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Type-check and bundle the WebUI
              # The WebUI is TypeScript (webui/src); esbuild bundles it into
              # module/webroot/js/app.js, the one script the manager loads.
              run: |
                  npm ci
                  npm run typecheck
                  npm run build

            - name: Bundle license and notices
              # AGPL-3.0 has to travel with the program, so the flashable zip
              # carries its own copy. Copied at build time so the repo keeps a
              # single LICENSE / NOTICE.md (the copies are git-ignored).
              run: cp LICENSE NOTICE.md module/

            - name: Generate per-file integrity hashes
              run: sh scripts/gen-hashes.sh module

            - name: Package flashable zip
              id: pkg
              run: |
                  cd module
                  # module.prop MUST sit at the zip root or KSU/Magisk won't see it.
                  test -f module.prop
                  zip -r9 "../${{ steps.mod.outputs.zip }}" . \
                    -x '*.DS_Store' -x '__MACOSX/*' -x '*/.git*'
                  cd ..
                  SHA=$(sha256sum "${{ steps.mod.outputs.zip }}" | awk '{print $1}')
                  echo "$SHA  ${{ steps.mod.outputs.zip }}" > "${{ steps.mod.outputs.zip }}.sha256"
                  echo "zip_sha256=$SHA" >> "$GITHUB_OUTPUT"
                  echo "----- zip contents -----"
                  unzip -l "${{ steps.mod.outputs.zip }}"
                  echo "zip SHA-256: $SHA"

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ github.event.repository.name }}-${{ steps.mod.outputs.version }}
                  path: |
                      ${{ steps.mod.outputs.zip }}
                      ${{ steps.mod.outputs.zip }}.sha256
                  if-no-files-found: error
                  compression-level: 0

            # ---------- CI-only (runs on manual runs, not tags) ----------
            - name: Send CI build to Telegram
              if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  ZIP: ${{ steps.mod.outputs.zip }}
                  VERSION: ${{ steps.mod.outputs.version }}
                  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GIT_REF_NAME: ${{ github.ref_name }}
                  GIT_REF_TYPE: ${{ github.ref_type }}
                  GIT_SHA: ${{ github.sha }}
              run: python3 .github/scripts/telegram.py --zip "$ZIP" --channel CI --version "$VERSION"

            # ---------- release-only (runs on v* tags) ----------
            - name: Publish GitHub Release
              id: release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                  name: ${{ steps.mod.outputs.version }}
                  tag_name: ${{ github.ref_name }}
                  files: |
                      ${{ steps.mod.outputs.zip }}
                      ${{ steps.mod.outputs.zip }}.sha256
                  generate_release_notes: true
                  fail_on_unmatched_files: true

            - name: Send Release build to Telegram
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  ZIP: ${{ steps.mod.outputs.zip }}
                  VERSION: ${{ steps.mod.outputs.version }}
                  RELEASE_URL: ${{ steps.release.outputs.url }}
                  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  GIT_REF_NAME: ${{ github.ref_name }}
                  GIT_REF_TYPE: ${{ github.ref_type }}
                  GIT_SHA: ${{ github.sha }}
              run: python3 .github/scripts/telegram.py --zip "$ZIP" --channel Release --version "$VERSION" --release-url "$RELEASE_URL"

            - name: Refresh update.json on the default branch
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  VERSION: ${{ steps.mod.outputs.version }}
                  VERSION_CODE: ${{ steps.mod.outputs.version_code }}
                  ZIP: ${{ steps.mod.outputs.zip }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin "$DEFAULT_BRANCH"
                  git checkout "$DEFAULT_BRANCH"
                  cat > update.json <<EOF
                  {
                    "version": "$VERSION",
                    "versionCode": $VERSION_CODE,
                    "zipUrl": "https://github.com/$REPO/releases/download/$TAG/$ZIP",
                    "changelog": "https://raw.githubusercontent.com/$REPO/$DEFAULT_BRANCH/CHANGELOG.md"
                  }
                  EOF
                  if git diff --quiet -- update.json; then
                    echo "update.json already up to date"
                  else
                    git add update.json
                    git commit -m "ci: bump update.json to $VERSION"
                    git push origin "$DEFAULT_BRANCH"
                  fi
